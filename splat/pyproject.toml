[project]
name = "splat"
version = "0.1.0"
description = "Modal worker for 3D Gaussian Splatting scans for Home Condition Assessment"
requires-python = ">=3.11"
# Local dependencies are only for testing pipeline steps without a GPU and for `modal deploy`.
# GPU dependencies (torch, gsplat, COLMAP, ffmpeg) are installed in the Modal image; see app.py.
dependencies = [
    "modal==1.5.5",
    "fastapi==0.141.1",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Reuse analisis.py from the analyzer service.
pythonpath = [".", "../analyzer"]
