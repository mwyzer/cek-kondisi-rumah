[project]
name = "analyzer"
version = "0.1.0"
description = "Analisis foto rumah otomatis (OpenCV): kualitas foto, indikasi retak, indikasi noda/rembesan"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Model deteksi kerusakan RF-DETR (Apache 2.0). Pasang dengan: uv sync --extra deteksi
deteksi = ["rfdetr==1.11.0"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
